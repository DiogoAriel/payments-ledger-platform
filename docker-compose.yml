# Local stack: API + PostgreSQL + Redpanda (Kafka API) + OpenTelemetry collector + Jaeger.
# Usage: docker compose up --build   (then open http://localhost:8080/swagger and http://localhost:16686)
services:
  api:
    build:
      context: .
      dockerfile: src/Ledger.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      Database__AutoMigrate: "true"
      ConnectionStrings__Ledger: Host=postgres;Port=5432;Database=ledger;Username=ledger;Password=ledger
      Messaging__Kafka__BootstrapServers: redpanda:9092
      Webhooks__Providers__acme-pay__Secret: dev-only-secret-change-me
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      otel-collector:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

volumes:
  postgres-data:
