version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it: a fresh package is a fresh supply-chain risk.
    cooldown:
      default-days: 7
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /src/Ledger.Api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directory: /deploy/terraform/aws
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
