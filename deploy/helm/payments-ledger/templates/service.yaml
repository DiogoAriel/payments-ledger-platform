apiVersion: v1
kind: Service
metadata:
  name: {{ include "payments-ledger.fullname" . }}
  labels:
    {{- include "payments-ledger.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "payments-ledger.selectorLabels" . | nindent 4 }}
---
{{- if .Values.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "payments-ledger.fullname" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "payments-ledger.selectorLabels" . | nindent 6 }}
{{- end }}
