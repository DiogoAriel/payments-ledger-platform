# Default-deny for the API pods except what they need: HTTP in on the container port, and out to
# DNS, the database, the message broker, the OTLP collector and HTTPS (AWS APIs, OIDC authority).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "payments-ledger.fullname" . }}
  labels:
    {{- include "payments-ledger.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "payments-ledger.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 4317
          protocol: TCP
        - port: 443
          protocol: TCP
